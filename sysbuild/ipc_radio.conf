# 1. Hardware-Specific Controller Selection
CONFIG_BT_LL_SOFTDEVICE=y

# 2. Multi-link Capacity (This is the most critical setting)
CONFIG_BT_MAX_CONN=5

# Increase the number of advertising sets the controller can handle
CONFIG_BT_CTLR_ADV_SET=2
CONFIG_BT_CENTRAL=y
# 3. SoftDevice-Specific Buffering
# SDC uses these for HCI Event and Data flow
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_BUF_ACL_TX_COUNT=10

# 4. Radio Timing Optimization
# This gives the radio more "breathing room" to handle 3 devices
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=7500